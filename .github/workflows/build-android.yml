name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install npm dependencies
        run: |
          echo "=== Installing npm dependencies ==="
          npm install
          echo "=== Dependencies installed ==="
          ls node_modules/.bin/expo 2>/dev/null && echo "expo CLI found" || echo "expo CLI NOT found"

      - name: 🏗️ Expo Prebuild (generate Android native code)
        run: |
          echo "=== Running expo prebuild ==="
          npx expo prebuild --platform android --no-install --clean 2>&1
          echo "=== Prebuild exit code: $? ==="
          ls -la android/ 2>/dev/null || echo "android directory not found"
        env:
          EXPO_NO_DOTENV: '1'
          CI: 'true'

      - name: 📱 Build Android APK (Gradle assembleRelease)
        run: |
          echo "=== Building APK with Gradle ==="
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -100
          echo "=== Gradle exit code: $? ==="

      - name: 🔍 Find APK files
        run: |
          echo "=== Looking for APK ==="
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found!"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ./english-grammar-app.apk
            echo "APK copied successfully"
            ls -lh english-grammar-app.apk
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-grammar-app-android
          path: english-grammar-app.apk

      - name: 🏷️ Get version info
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.date }}-${{ github.run_number }}
          name: English Grammar App ${{ steps.version.outputs.date }}
          body: |
            ## 📱 English Grammar Guide - Android App
            
            Built automatically from commit `${{ github.sha }}`.
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Platform:** Android (APK)
            **Version:** ${{ steps.version.outputs.version }}
            
            ### 📲 How to install
            1. Download the `.apk` file below
            2. Open it on your Android phone
            3. Allow installation from unknown sources if prompted
            4. Enjoy learning grammar! 🎉
            
            ### 📚 Features
            - 21 grammar chapters
            - Present, Past, Future tenses
            - Passive voice, conditionals, modals, and more
            - Interactive mini quizzes
            
            ---
            *Auto-generated by GitHub Actions*
          files: |
            english-grammar-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
