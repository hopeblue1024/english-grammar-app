name: Build Android APK

# Trigger this workflow on push to main branch, or manually
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      buildProfile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛠️ Install EAS CLI
        run: npm install -g eas-cli

      - name: 🏗️ Build Android APK with EAS
        run: eas build --platform android --profile preview --non-interactive --output app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-grammar-app-android
          path: app-release.apk
          if-no-files-found: error

      - name: 🏷️ Get version info
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.date }}-${{ github.run_number }}
          name: English Grammar App ${{ steps.version.outputs.date }}
          body: |
            ## 📱 English Grammar Guide - Android App
            
            Built automatically from commit `${{ github.sha }}`.
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Platform:** Android (APK)
            **Profile:** Preview
            
            ### 📲 How to install
            1. Download the `.apk` file below
            2. Open it on your Android phone
            3. Allow installation from unknown sources if prompted
            4. Enjoy learning grammar! 🎉
            
            ---
            *Auto-generated by GitHub Actions*
          files: |
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
