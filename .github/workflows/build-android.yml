name: Build Android APK

# Trigger this workflow on push to main branch, or manually
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: 🏗️ Prebuild - Generate native Android code
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_DOTENV: '1'

      - name: 📱 Build Android APK (Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Locate APK file
        run: |
          echo "Looking for APK files..."
          find android/app/build/outputs/apk -name "*.apk"
          cp android/app/build/outputs/apk/release/app-release.apk ./english-grammar-app.apk
          ls -lh ./english-grammar-app.apk

      - name: 📤 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-grammar-app-android
          path: english-grammar-app.apk

      - name: 🏷️ Get version info
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.date }}-${{ github.run_number }}
          name: English Grammar App ${{ steps.version.outputs.date }}
          body: |
            ## 📱 English Grammar Guide - Android App
            
            Built automatically from commit `${{ github.sha }}`.
            
            **Build Date:** ${{ steps.version.outputs.date }}
            **Platform:** Android (APK)
            **Version:** ${{ steps.version.outputs.version }}
            
            ### 📲 How to install
            1. Download the `.apk` file below
            2. Open it on your Android phone
            3. Allow installation from unknown sources if prompted
            4. Enjoy learning grammar! 🎉
            
            ### 📚 Features
            - 21 grammar chapters
            - Present, Past, Future tenses
            - Passive voice, conditionals, modals, and more
            - Interactive mini quizzes
            
            ---
            *Auto-generated by GitHub Actions*
          files: |
            english-grammar-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
